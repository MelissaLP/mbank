############################################
# mbank on the isobank eccentric 5D space (isobank: configs/eccentric_5d.py)
#
# Run from this folder:
#	mbank_generate_flow_dataset eccentric_5d.ini
#	mbank_train_flow eccentric_5d.ini
#	mbank_place_templates eccentric_5d.ini
#
# The bank (eccentric_5d/bank.npy) is in the isobank coordinates and is scored
# with isobank's scripts/evaluate_bank.py --bank ... --save-ff ...
############################################

[eccentric_5d]

	#File settings
run-dir: eccentric_5d
dataset: dataset.dat
flow-file: flow.zip
bank-file: bank.npy

	#Metric settings: as isobank make_metric()
variable-format: m1m2_s1z_s2z_e
psd: ./aligo_O3actual_H1.txt
asd: true
ifo: H1
metric-type: symphony
approximant: TaylorF2Ecc
f-min: 15
f-max: 1024

	#Parameter space ranges: as isobank (q > 1, mbank's default, enforces m1 >= m2)
m1-range: 1 7
m2-range: 1 3
s1-range: -0.9 0.9
s2-range: -0.05 0.05
e-range: 1e-5 0.15

	#Dataset generation & flow training (mbank's eccentric example; set before the scan)
n-datapoints: 20000
only-ll: true
loss-function: ll_mse
n-layers: 2
hidden-features: 30
n-epochs: 10000
learning-rate: 0.005
batch-size: 500
train-fraction: 0.8
patience: 20
min-delta: 1e-3
load-flow: false

	#Placement
placing-method: random
mm: 0.97
n-livepoints: 2000
covering-fraction: 0.9

	#Communication with the user
plot: true
show: false
verbose: true
